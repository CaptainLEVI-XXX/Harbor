query HistoryClaims($series: String!, $after: Bytes!, $first: Int!, $block: Block_height!) {
  _meta(block: $block) { deployment hasIndexingErrors block { number hash } }
  withdrawalClaims(block: $block, first: $first, orderBy: id, orderDirection: asc, where: {series: $series, id_gt: $after}) {
    id series { id } blockNumber blockHash transactionHash transactionIndex logIndex timestamp requestId ownerAtClaim receiver amount
  }
}
