[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 700
via_ir = true
# Keep multiple calls within a Solidity test in the same transaction so
# transient-context cleanup and sequential-call tests exercise their intent.
isolate = false
# Keep failure traces available; successful tests remain concise.
verbosity = 3
# Ordinary tests verify committed measurements rather than silently replacing them.
gas_snapshot_check = true
gas_snapshot_emit = false
no_match_path = "test/fork/**"

[profile.default.fuzz]
runs = 64
seed = "0x484152424f52"

[profile.default.invariant]
runs = 32
depth = 16
fail_on_revert = true

[profile.unit]
no_match_path = "test/fork/**"

# Backwards-compatible alias: now runs the entire small local suite, not a filter.
[profile.settlement]

[profile.compatibility]
match_contract = "StandingTradingTest"

[profile.invariant]
match_path = "test/invariant/**/*.t.sol"

[profile.fork]
match_path = "test/fork/**/*.t.sol"
# An empty exclusion pattern matches every path in this Foundry version.
# Override the default fork exclusion with a disjoint, explicit test directory.
no_match_path = "test/invariant/**"

[profile.gas]
match_path = "test/gas/**/*.t.sol"

[rpc_endpoints]
hoodi = "${HOODI_RPC_URL}"

[fmt]
tab_width = 2

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
