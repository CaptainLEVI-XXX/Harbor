[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 700
via_ir = true
# Keep multiple calls within a Solidity test in the same transaction so
# transient-context cleanup and sequential-call tests exercise their intent.
isolate = false
# Required by opcode-trace assertions; successful tests remain concise.
verbosity = 3
# Ordinary tests verify committed measurements rather than silently replacing them.
gas_snapshot_check = true
gas_snapshot_emit = false
no_match_path = "test/fork/**"

[profile.default.fuzz]
runs = 256
seed = "0x484152424f52"

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = true

[profile.unit]
no_match_path = "test/fork/**"

[profile.compatibility]
match_path = "test/compatibility/**/*.t.sol"

[profile.invariant]
match_path = "test/invariant/**/*.t.sol"

[profile.invariant.invariant]
runs = 256
depth = 64
fail_on_revert = true

[profile.fork]
match_path = "test/fork/**/*.t.sol"
# An empty exclusion pattern matches every path in this Foundry version.
# Override the default fork exclusion with a disjoint, explicit test directory.
no_match_path = "test/invariant/**"

[profile.gas]
match_path = "test/gas/**/*.t.sol"

[fmt]
tab_width = 2

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
